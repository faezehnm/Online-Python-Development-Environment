<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>کلاس کدنوردی | دبیرستان مفید</title>
    <style>
        body {
            font-family: Tahoma, "B Yekan", "Vazir", sans-serif;
            display: flex;
            flex-direction: column;
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            padding: 10px;
            box-sizing: border-box;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(10px);
            color: #4a4a4a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 15px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.8);
        }
        
        .logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
            background-color: white;
            border-radius: 12px;
            padding: 4px;
            margin-left: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .title-container {
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 18px;
            font-weight: 900;
            color: #6c5ce7;
        }

        .header-sub {
            font-size: 11px;
            font-weight: bold;
            margin-top: 2px;
            color: #8395a7;
        }

        /* ساختار دو ستونه */
        .main-layout {
            display: flex;
            flex: 1;
            gap: 12px;
            min-height: 0;
        }

        .code-column, .output-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }

        @media (min-width: 769px) {
            .main-layout {
                flex-direction: row-reverse; /* صفحه کد در چپ و خروجی در راست */
            }
        }

        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
            }
            #turtleBox { order: 1; }
            #terminalBox { order: 2; }
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            margin-bottom: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.8);
            position: relative;
        }

        .editor-header {
            background: #f1f2f6;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            color: #4a4a4a;
            border-bottom: 1px solid #dfe4ea;
        }

        #suggestion-bar {
            display: flex; 
            align-items: center;
            min-height: 26px;
            background: #f1f2f6;
            padding: 6px 10px;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 2px solid #dfe4ea;
            direction: ltr; 
            gap: 8px;
            scroll-behavior: smooth;
        }
        
        #suggestion-bar::-webkit-scrollbar { display: none; }

        .sugg-btn {
            background: #6c5ce7;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 4px 10px;
            font-family: "Courier New", monospace;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(108, 92, 231, 0.3);
            margin-right: 6px;
            display: inline-block;
        }
        .sugg-btn:active { transform: scale(0.95); background: #a29bfe; }

        /* بخش شماره خطوط و ویرایشگر */
        .editor-wrapper {
            display: flex;
            direction: ltr;
            flex: 1;
            overflow: hidden;
            background-color: transparent;
        }

        .line-numbers {
            width: 40px;
            min-width: 40px;
            padding: 12px 5px;
            background: #f8f9fa;
            color: #a4b0be;
            font-family: "Courier New", monospace;
            font-size: 15px;
            line-height: 1.5;
            text-align: center;
            border-right: 1px solid #dfe4ea;
            user-select: none;
            overflow-y: hidden;
            box-sizing: border-box;
        }

        textarea {
            flex: 1;
            font-family: "Courier New", monospace;
            font-size: 15px;
            padding: 12px;
            border: none;
            resize: none;
            background-color: transparent;
            color: #2d3436;
            direction: ltr;
            text-align: left;
            line-height: 1.5;
            white-space: pre;
            overflow: auto;
            box-sizing: border-box;
        }
        textarea:focus { outline: none; }
        textarea::placeholder { color: #b2bec3; }
        
        .btn-container {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        #runBtn {
            flex: 3;
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            color: white;
            font-size: 17px;
            font-weight: bold;
            padding: 12px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.4);
            transition: all 0.2s ease;
        }
        #runBtn:active { transform: scale(0.96); }
        #runBtn:disabled { background: #dfe6e9; color: #b2bec3; box-shadow: none; cursor: wait; }

        #stopBtn {
            flex: 1;
            background: linear-gradient(135deg, #ff6b81, #ff4757);
            color: white;
            font-size: 15px;
            font-weight: bold;
            padding: 12px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 12px rgba(255, 107, 129, 0.4);
            transition: all 0.2s ease;
        }
        #stopBtn:active { transform: scale(0.96); }
        
        .output-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }

        .turtle-container {
            display: none; 
            flex: 1;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            flex-direction: column;
            overflow: hidden;
            border: 2px solid #a29bfe;
        }

        .output-header {
            background: #f1f2f6;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: bold;
            color: #4a4a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #dfe4ea;
        }

        .turtle-controls {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .ctrl-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 2px 6px;
            font-weight: bold;
            cursor: pointer;
            color: #4a5568;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .ctrl-btn:active { background: #e2e8f0; }
        
        .speed-slider {
            width: 70px;
            cursor: pointer;
        }

        #turtleCanvas {
            width: 100%;
            flex: 1;
            background: #fafafa;
            cursor: grab;
        }
        #turtleCanvas:active {
            cursor: grabbing;
        }

        .terminal-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e1e2f;
            border-radius: 16px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .terminal-header {
            background: #2a2a40;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .terminal-left { display: flex; align-items: center; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }

        .terminal-title { color: #a4b0be; font-size: 11px; font-family: Tahoma; }

        pre {
            flex: 1;
            font-family: "Courier New", monospace;
            font-size: 13px;
            margin: 0;
            padding: 10px;
            overflow-y: auto;
            white-space: pre-wrap;
            direction: ltr;
            text-align: left;
            line-height: 1.4;
        }

        .text-normal { color: #f1f2f6; }
        .text-input { color: #ff9ff3; font-weight: bold; }
        .text-error { color: #ff6b81; }
        .text-system { color: #7bed9f; font-family: Tahoma; text-align: right; display: block; margin-bottom: 5px;}

        .assignment-card {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin-bottom: 8px;
            padding: 10px;
            background: rgba(255,255,255,.88);
            border: 1px solid rgba(255,255,255,.9);
            border-radius: 14px;
            box-shadow: 0 4px 12px rgba(0,0,0,.06);
        }
        .assignment-card label { display: flex; flex-direction: column; gap: 5px; font-size: 11px; font-weight: bold; color: #4a4a4a; }
        .assignment-card input, .assignment-card select {
            width: 100%; min-width: 0; box-sizing: border-box; padding: 8px;
            border: 1px solid #dfe4ea; border-radius: 8px; background: #fff;
            font: inherit; color: #2d3436;
        }
        #submitBtn {
            width: 100%; margin-bottom: 8px; padding: 11px; border: 0; border-radius: 13px;
            background: linear-gradient(135deg, #00b894, #00a383); color: #fff;
            font: bold 14px Tahoma, sans-serif; cursor: pointer;
        }
        #submitBtn:disabled { opacity: .55; cursor: not-allowed; }
        @media (max-width: 768px) {
            body { height: auto; min-height: 100vh; }
            .assignment-card { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .main-layout { min-height: 75vh; }
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="لوگوی مجتمع آموزشی مفید" class="logo" onerror="this.style.display='none'">
        <div class="title-container">
            <div class="main-title">✨ کلاس کدنوردی ✨</div>
            <div class="header-sub">متوسطه دوره اول دخترانه مفید</div>
        </div>
    </div>

    <section class="assignment-card" aria-label="مشخصات تحویل">
        <label>نوع کار
            <select id="workType">
                <option value="practice">تمرین</option>
                <option value="homework">تکلیف</option>
            </select>
        </label>
        <label><span id="firstStudentLabel">نام دانش‌آموز اول</span>
            <input id="studentOne" type="text" maxlength="60" placeholder="نام و نام خانوادگی">
        </label>
        <label id="secondStudentField">نام دانش‌آموز دوم
            <input id="studentTwo" type="text" maxlength="60" placeholder="نام و نام خانوادگی">
        </label>
    </section>

    <div class="main-layout">
        
        <!-- ستون مربوط به ادیتور کد و دکمه‌ها -->
        <div class="code-column">
            <div class="editor-container">
                <div class="editor-header">💻 صفحه کد</div>
                <div id="suggestion-bar"></div>
                <div class="editor-wrapper">
                    <div class="line-numbers" id="lineNumbers">1</div>
                    <textarea id="code" 
                              autocapitalize="none" 
                              autocorrect="off" 
                              autocomplete="off" 
                              spellcheck="false" 
                              placeholder="# کدهای پایتون خود را اینجا بنویسید..."></textarea>
                </div>
            </div>
            
            <div class="btn-container">
                <button id="runBtn" onclick="runPython()" disabled>⏳ در حال راه‌اندازی...</button>
                <button id="stopBtn" onclick="stopExecution()">🛑 توقف</button>
            </div>
            <button id="submitBtn" onclick="downloadSubmission()" disabled>📦 آماده‌کردن پروندهٔ تحویل</button>
        </div>

        <!-- ستون مربوط به خروجی‌ها (ترتل و ترمینال) -->
        <div class="output-column">
            <div class="output-section">
                <!-- صفحه نمایش Turtle -->
                <div class="turtle-container" id="turtleBox">
                    <div class="output-header">
                        <span>🐢 صفحه نمایش Turtle</span>
                        <div class="turtle-controls">
                            <input type="range" class="speed-slider" min="1" max="10" value="5" oninput="setSpeed(this.value)" title="سرعت حرکت">
                            <button class="ctrl-btn" onclick="zoomTurtle(0.8)" title="کوچک‌نمایی">➖</button>
                            <button class="ctrl-btn" onclick="zoomTurtle(1.25)" title="بزرگ‌نمایی">➕</button>
                            <button class="ctrl-btn" onclick="resetTurtleView()" title="بازگشت به مرکز">🏠</button>
                            <button class="ctrl-btn" onclick="clearTurtleScreen()" title="پاک کردن صفحه">🧹</button>
                            <button class="ctrl-btn" onclick="closeTurtleBox()" title="بستن صفحه">✕</button>
                        </div>
                    </div>
                    <canvas id="turtleCanvas"></canvas>
                </div>

                <!-- خروجی متنی -->
                <div class="terminal-container" id="terminalBox">
                    <div class="terminal-header">
                        <div class="terminal-left">
                            <div class="dot red"></div>
                            <div class="dot yellow"></div>
                            <div class="dot green"></div>
                        </div>
                        <div class="terminal-title">صفحه نمایش</div>
                    </div>
                    <pre id="output"></pre>
                </div>
            </div>
        </div>
        
    </div>

    <script type="module">
        import { loadPyodide } from "./pyodide/pyodide.mjs";

        let pyodideInstance;
        let turtleSpeed = 5; 
        let isRunning = false;
        let isCancelled = false;
        let lastRun = null;

        const pythonKeywords = [
            'turtle.forward()', 'turtle.backward()', 'turtle.right()', 'turtle.left()', 
            'turtle.goto()', 'turtle.circle()', 'turtle.color()', 'turtle.fillcolor()', 
            'turtle.bgcolor()', 'turtle.begin_fill()', 'turtle.end_fill()', 'turtle.penup()', 
            'turtle.pendown()', 'turtle.width()', 'turtle.clear()', 'turtle.shape()', 'print()', 'input()', 'import turtle'
        ];

        const textarea = document.getElementById('code');
        const suggestionBar = document.getElementById('suggestion-bar');
        const lineNumbers = document.getElementById('lineNumbers');

        function updateLineNumbers() {
            const linesCount = textarea.value.split('\n').length;
            let numbersHtml = '';
            for (let i = 1; i <= linesCount; i++) {
                numbersHtml += i + '<br>';
            }
            lineNumbers.innerHTML = numbersHtml;
        }

        textarea.addEventListener('scroll', () => {
            lineNumbers.scrollTop = textarea.scrollTop;
        });

        function updateSuggestions() {
            let cursor = textarea.selectionStart;
            let text = textarea.value;
            let textBeforeCursor = text.substring(0, cursor);
            let match = textBeforeCursor.match(/[a-zA-Z_.]+$/);

            if (match) {
                let typedWord = match[0].toLowerCase();
                let suggestions = pythonKeywords.filter(k => k.toLowerCase().startsWith(typedWord) && k.toLowerCase() !== typedWord);

                if (suggestions.length > 0) {
                    suggestionBar.innerHTML = '';
                    suggestions.forEach(s => {
                        let btn = document.createElement('button');
                        btn.className = 'sugg-btn';
                        btn.innerText = s;
                        btn.onmousedown = (e) => {
                            e.preventDefault(); 
                            applySuggestion(typedWord, s, cursor);
                        };
                        suggestionBar.appendChild(btn);
                    });
                } else {
                    suggestionBar.innerHTML = ''; 
                }
            } else {
                suggestionBar.innerHTML = '';
            }
        }

        function applySuggestion(typedWord, suggestion, cursor) {
            let text = textarea.value;
            let startText = text.substring(0, cursor - typedWord.length);
            let endText = text.substring(cursor);

            textarea.value = startText + suggestion + endText;
            let newCursor = startText.length + suggestion.length;
            if (suggestion.endsWith('()')) { newCursor -= 1; }
            
            textarea.selectionStart = textarea.selectionEnd = newCursor;
            suggestionBar.innerHTML = '';
            updateLineNumbers();
            textarea.focus();
        }

        textarea.addEventListener('input', () => {
            lastRun = null;
            document.getElementById('submitBtn').disabled = true;
            updateSuggestions();
            updateLineNumbers();
        });
        function updateSubmissionFields() {
            const isHomework = document.getElementById('workType').value === 'homework';
            document.getElementById('secondStudentField').style.display = isHomework ? 'none' : 'flex';
            document.getElementById('firstStudentLabel').textContent = isHomework ? 'نام دانش‌آموز' : 'نام دانش‌آموز اول';
            document.getElementById('submitBtn').textContent = isHomework
                ? '📦 آماده‌کردن پروندهٔ تحویل تکلیف'
                : '📦 آماده‌کردن پروندهٔ تحویل تمرین گروهی';
        }
        document.getElementById('workType').addEventListener('change', updateSubmissionFields);
        updateSubmissionFields();
        textarea.addEventListener('keyup', updateSuggestions);
        textarea.addEventListener('click', updateSuggestions);

        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                let start = this.selectionStart;
                let end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
                updateLineNumbers();
            }
            const pairs = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'" };
            if (pairs[e.key]) {
                e.preventDefault();
                let start = this.selectionStart;
                let end = this.selectionEnd;
                this.value = this.value.substring(0, start) + e.key + pairs[e.key] + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 1;
                updateLineNumbers();
            }
        });

        updateLineNumbers();

        window.setSpeed = function(val) { turtleSpeed = val; };
        window.getTurtleSpeed = function() { return turtleSpeed; };
        window.getIsCancelled = function() { return isCancelled; };

        window.stopExecution = function() {
            isCancelled = true;
            window.printTerminal("\n⚠️ درخواست توقف توسط کاربر صادر شد.\n", "error");
        };

        let canvas, ctx, cx, cy;
        let zoomLevel = 1.0; 
        let panX = 0, panY = 0;
        let canvasBgColor = "#fafafa";
        let drawingCommands = [];
        let listenersAttached = false;

        window.initTurtleCanvas = function() {
            canvas = document.getElementById('turtleCanvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d');

            let displayWidth = canvas.parentElement.clientWidth || 300;
            let displayHeight = canvas.parentElement.clientHeight - 30 || 220;
            
            let dpr = window.devicePixelRatio || 1;
            canvas.width = displayWidth * dpr;
            canvas.height = displayHeight * dpr;
            canvas.style.width = displayWidth + 'px';
            canvas.style.height = displayHeight + 'px';

            ctx.scale(dpr, dpr);

            cx = displayWidth / 2;
            cy = displayHeight / 2;
            redrawCanvas();

            if (!listenersAttached) {
                listenersAttached = true;
                let isDragging = false;
                let startX = 0, startY = 0;

                canvas.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    startX = e.clientX - panX;
                    startY = e.clientY - panY;
                });
                window.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    panX = e.clientX - startX;
                    panY = e.clientY - startY;
                    redrawCanvas();
                });
                window.addEventListener('mouseup', () => { isDragging = false; });

                canvas.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        isDragging = true;
                        startX = e.touches[0].clientX - panX;
                        startY = e.touches[0].clientY - panY;
                    }
                }, {passive: true});
                window.addEventListener('touchmove', (e) => {
                    if (!isDragging || e.touches.length !== 1) return;
                    panX = e.touches[0].clientX - startX;
                    panY = e.touches[0].clientY - startY;
                    redrawCanvas();
                }, {passive: true});
                window.addEventListener('touchend', () => { isDragging = false; });
            }
        };

        window.clearTurtleScreen = function() {
            drawingCommands = [];
            canvasBgColor = "#fafafa";
            if (ctx && canvas) {
                redrawCanvas();
            }
        };

        window.setCanvasBg = function(color) {
            canvasBgColor = color;
            redrawCanvas();
        };

        window.zoomTurtle = function(factor) {
            zoomLevel *= factor;
            if (zoomLevel < 0.2) zoomLevel = 0.2;
            if (zoomLevel > 5.0) zoomLevel = 5.0;
            redrawCanvas();
        };

        window.resetTurtleView = function() {
            zoomLevel = 1.0;
            panX = 0;
            panY = 0;
            redrawCanvas();
        };

        window.redrawCanvas = function() {
            if (!ctx || !canvas) return;
            let displayWidth = canvas.width / (window.devicePixelRatio || 1);
            let displayHeight = canvas.height / (window.devicePixelRatio || 1);

            ctx.fillStyle = canvasBgColor;
            ctx.fillRect(0, 0, displayWidth, displayHeight);
            
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            let currentCx = cx + panX;
            let currentCy = cy + panY;

            for (let cmd of drawingCommands) {
                if (cmd.type === 'line') {
                    ctx.strokeStyle = cmd.color;
                    ctx.lineWidth = cmd.width * zoomLevel;
                    ctx.beginPath();
                    ctx.moveTo(currentCx + cmd.x1 * zoomLevel, currentCy - cmd.y1 * zoomLevel);
                    ctx.lineTo(currentCx + cmd.x2 * zoomLevel, currentCy - cmd.y2 * zoomLevel);
                    ctx.stroke();
                } else if (cmd.type === 'fill') {
                    ctx.fillStyle = cmd.fill_color;
                    ctx.beginPath();
                    let pts = cmd.points;
                    ctx.moveTo(currentCx + pts[0][0] * zoomLevel, currentCy - pts[0][1] * zoomLevel);
                    for (let i = 1; i < pts.length; i++) {
                        ctx.lineTo(currentCx + pts[i][0] * zoomLevel, currentCy - pts[i][1] * zoomLevel);
                    }
                    ctx.closePath();
                    ctx.fill();
                    if (cmd.border_color) {
                        ctx.strokeStyle = cmd.border_color;
                        ctx.lineWidth = cmd.width * zoomLevel;
                        ctx.stroke();
                    }
                } else if (cmd.type === 'text') {
                    ctx.font = (parseInt(cmd.fontSize) * zoomLevel) + 'px Arial';
                    ctx.fillStyle = cmd.color || 'black';
                    ctx.fillText(cmd.text, currentCx + cmd.x * zoomLevel, currentCy - cmd.y * zoomLevel);
                } else if (cmd.type === 'cursor') {
                    if (cmd.visible) {
                        ctx.save();
                        ctx.translate(currentCx + cmd.x * zoomLevel, currentCy - cmd.y * zoomLevel);
                        ctx.rotate(-cmd.angle * Math.PI / 180);
                        
                        let shape = cmd.shape || 'classic';
                        ctx.fillStyle = shape === 'turtle' ? '#00b894' : '#e84393';
                        
                        ctx.beginPath();
                        if (shape === 'circle') {
                            ctx.arc(0, 0, 6 * zoomLevel, 0, 2 * Math.PI);
                        } else if (shape === 'square') {
                            ctx.rect(-5 * zoomLevel, -5 * zoomLevel, 10 * zoomLevel, 10 * zoomLevel);
                        } else if (shape === 'turtle') {
                            ctx.arc(7 * zoomLevel, 0, 3 * zoomLevel, 0, 2 * Math.PI);
                            ctx.fill(); ctx.beginPath();
                            ctx.arc(3 * zoomLevel, 5 * zoomLevel, 1.5 * zoomLevel, 0, 2 * Math.PI); ctx.fill(); ctx.beginPath();
                            ctx.arc(3 * zoomLevel, -5 * zoomLevel, 1.5 * zoomLevel, 0, 2 * Math.PI); ctx.fill(); ctx.beginPath();
                            ctx.arc(-3 * zoomLevel, 5 * zoomLevel, 1.5 * zoomLevel, 0, 2 * Math.PI); ctx.fill(); ctx.beginPath();
                            ctx.arc(-3 * zoomLevel, -5 * zoomLevel, 1.5 * zoomLevel, 0, 2 * Math.PI); ctx.fill(); ctx.beginPath();
                            ctx.moveTo(-6 * zoomLevel, 0);
                            ctx.lineTo(-9 * zoomLevel, -1.5 * zoomLevel);
                            ctx.lineTo(-9 * zoomLevel, 1.5 * zoomLevel);
                            ctx.fill(); ctx.beginPath();
                            if (ctx.ellipse) {
                                ctx.ellipse(0, 0, 6 * zoomLevel, 5 * zoomLevel, 0, 0, 2 * Math.PI);
                            } else {
                                ctx.arc(0, 0, 6 * zoomLevel, 0, 2 * Math.PI);
                            }
                        } else if (shape === 'triangle') {
                            ctx.moveTo(8 * zoomLevel, 0);
                            ctx.lineTo(-6 * zoomLevel, -5 * zoomLevel);
                            ctx.lineTo(-6 * zoomLevel, 5 * zoomLevel);
                        } else {
                            ctx.moveTo(10 * zoomLevel, 0);
                            ctx.lineTo(-6 * zoomLevel, -6 * zoomLevel);
                            ctx.lineTo(-2 * zoomLevel, 0);
                            ctx.lineTo(-6 * zoomLevel, 6 * zoomLevel);
                        }
                        
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    }
                }
            }
        };

        window.draw_turtle_line = function(x1, y1, x2, y2, color, width) {
            drawingCommands.push({ type: 'line', x1, y1, x2, y2, color, width });
            redrawCanvas();
        };

        window.draw_turtle_fill = function(points, fill_color, border_color, width) {
            let cleanPoints = [];
            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                cleanPoints.push([Number(p[0]), Number(p[1])]);
            }
            drawingCommands.push({ type: 'fill', points: cleanPoints, fill_color, border_color, width });
            redrawCanvas();
        };

        window.draw_turtle_text = function(x, y, text, font, color) {
            let sizeMatch = font ? font.match(/(\d+)px/) : null;
            let fontSize = sizeMatch ? parseInt(sizeMatch[1]) : 12;
            drawingCommands.push({ type: 'text', x, y, text, fontSize, color });
            redrawCanvas();
        };

        window.draw_turtle_cursor = function(x, y, angle, visible, shape='classic') {
            drawingCommands = drawingCommands.filter(c => c.type !== 'cursor');
            drawingCommands.push({ type: 'cursor', x, y, angle, visible, shape });
            redrawCanvas();
        };

            document.getElementById('turtleBox').style.display = 'none';
        };

        window.printTerminal = function(msg, type = "normal") {
            let outputArea = document.getElementById("output");
            let span = document.createElement("span");
            
            if (type === "input") { span.className = "text-input"; }
            else if (type === "error") { span.className = "text-error"; }
            else if (type === "system") { span.className = "text-system"; }
            else { span.className = "text-normal"; }
            
            span.textContent = msg;
            outputArea.appendChild(span);
            outputArea.scrollTop = outputArea.scrollHeight; 
        };

        window.safePrompt = function(msg) {
            let answer = prompt(msg);
            return answer === null ? "" : answer;
        };

        function getFileBaseName() {
            const safe = value => value.trim().replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, '-').slice(0, 40);
            const isHomework = document.getElementById('workType').value === 'homework';
            const studentNames = [document.getElementById('studentOne').value];
            if (!isHomework) studentNames.push(document.getElementById('studentTwo').value);
            const names = studentNames.map(safe).filter(Boolean);
            return `${isHomework ? 'تکلیف' : 'تمرین'}-${names.join('-') || 'دانش‌آموز'}`;
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
        }

        window.downloadSubmission = function() {
            const isHomework = document.getElementById('workType').value === 'homework';
            const firstName = document.getElementById('studentOne').value.trim();
            const secondName = document.getElementById('studentTwo').value.trim();
            if (!firstName || (!isHomework && !secondName)) {
                alert(isHomework ? 'لطفاً نام دانش‌آموز را وارد کنید.' : 'لطفاً نام هر دو عضو گروه را وارد کنید.');
                return;
            }
            if (!lastRun || !lastRun.ran) {
                alert('ابتدا کد را یک‌بار اجرا کنید تا پروندهٔ تحویل آماده شود.');
                return;
            }
            const canvas = document.getElementById('turtleCanvas');
            const image = lastRun.success && lastRun.turtle && canvas ? canvas.toDataURL('image/png') : '';
            const output = document.getElementById('output').innerText;
            const studentNames = isHomework ? firstName : `${firstName} و ${secondName}`;
            const workLabel = isHomework ? 'تکلیف' : 'تمرین گروهی';
            const resultTitle = lastRun.success ? 'خروجی برنامه' : 'خطای اجرا';
            const report = `<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>پروندهٔ تحویل</title><style>body{font:16px Tahoma,sans-serif;max-width:1000px;margin:30px auto;padding:0 18px;color:#263238}h1,h2{color:#6c5ce7}pre{direction:ltr;text-align:left;white-space:pre-wrap;background:#1e1e2f;color:#f1f2f6;padding:16px;border-radius:10px;overflow:auto}img{max-width:100%;border:1px solid #ddd;border-radius:10px}.meta{background:#f4f2ff;padding:12px;border-radius:10px}</style><h1>پروندهٔ تحویل پایتون</h1><div class="meta"><p><b>نوع کار:</b> ${workLabel}</p><p><b>${isHomework ? 'نام دانش‌آموز' : 'اعضای گروه'}:</b> ${escapeHtml(studentNames)}</p><p><b>زمان تحویل:</b> ${escapeHtml(new Date().toLocaleString('fa-IR'))}</p></div>${image ? `<h2>تصویر ترسیم ترتل</h2><img alt="تصویر نتیجه" src="${image}">` : ''}<h2>کد پایتون</h2><pre>${escapeHtml(document.getElementById('code').value)}</pre><h2>${resultTitle}</h2><pre>${escapeHtml(output || (lastRun.success ? 'خروجی متنی ندارد.' : 'متن خطا در دسترس نیست.'))}</pre></html>`;
            const blob = new Blob([report], {type: 'text/html;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${getFileBaseName()}.html`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };

        async function initPyodide() {

                await pyodideInstance.runPythonAsync(`
import sys

turtle_mod = types.ModuleType('turtle')

class TurtleObj:
    def __init__(self):
        self.reset_state()
        self.command_count = 0

    def reset_state(self):
        self.x = 0
        self.y = 0
        self.angle = 0 
        self.is_down = True
        self.pen_color = "black"
        self.fill_color = "black"
        self.pen_width = 2
        self.is_filling = False
        self.fill_coords = []
        self.visible = True
        self.turtle_shape = "classic"
        self.command_count = 0

        self._refresh()

    def _refresh(self):
        js.draw_turtle_cursor(self.x, self.y, self.angle, self.visible, self.turtle_shape)

    def _sleep_logic(self):
        if js.getIsCancelled():
            raise Exception("🛑 اجرا توسط کاربر متوقف شد.")
        speed_val = float(js.getTurtleSpeed())
        if speed_val >= 10: return
        delay = (11 - speed_val) * 0.004
        if self.command_count > 100:
            delay *= 0.1
        time.sleep(delay)

    def forward(self, distance):
        self.command_count += 1
        steps = max(int(abs(distance) / 4), 1)
        if self.command_count > 100:
            steps = 1
            
        d_step = distance / steps
        for _ in range(steps):
            if js.getIsCancelled():
                raise Exception("🛑 اجرا توسط کاربر متوقف شد.")
            rad = math.radians(self.angle)
            nx = self.x + d_step * math.cos(rad)
            ny = self.y + d_step * math.sin(rad)
            if self.is_down:
                js.draw_turtle_line(self.x, self.y, nx, ny, self.pen_color, self.pen_width)
            if self.is_filling:
                self.fill_coords.append((nx, ny))
            self.x, self.y = nx, ny
            self._refresh()
            self._sleep_logic()

    def fd(self, d): self.forward(d)
    def backward(self, distance): self.forward(-distance)

        self._refresh()
        self._sleep_logic()

    def goto(self, x, y):
        self.command_count += 1
        target_x, target_y = float(x), float(y)
        dx = target_x - self.x
        dy = target_y - self.y
        dist = math.hypot(dx, dy)
        steps = max(int(dist / 5), 1)
        if self.command_count > 100:
            steps = 1
            
        sx = dx / steps
        sy = dy / steps
        for _ in range(steps):
            if js.getIsCancelled():
                raise Exception("🛑 اجرا توسط کاربر متوقف شد.")
            nx = self.x + sx
            ny = self.y + sy

            if self.is_filling:
                self.fill_coords.append((nx, ny))
            self.x, self.y = nx, ny
            self._refresh()
            self._sleep_logic()

    def setposition(self, x, y): self.goto(x, y)
    def setpos(self, x, y): self.goto(x, y)
    def setx(self, x): self.goto(x, self.y)

    def setheading(self, angle): self.angle = float(angle) % 360; self._refresh()
    def seth(self, angle): self.setheading(angle)

    def circle(self, radius, extent=360, steps=None):
        if steps is None:
            steps = 36

        for _ in range(steps):
            if js.getIsCancelled():
                raise Exception("🛑 اجرا توسط کاربر متوقف شد.")
            self.forward(d_len)
            self.left(d_angle)

    def pendown(self): self.is_down = True

    def down(self): self.pendown()

    def penup(self): self.is_down = False

    def up(self): self.penup()

        self.fill_color = c

    def width(self, w=None):
